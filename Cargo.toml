[workspace]
members = [
    "crates/matcha-app",
    "crates/matcha-config",
    "crates/matcha-core",
    "crates/matcha-pty",
    "crates/matcha-terminal",
    "crates/matcha-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"

[workspace.dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0"
atomicwrites = "0.4"
crossbeam-channel = "0.5"
directories = "6.0"
floem = "=0.2.0"
floem_renderer = "=0.2.0"
parking_lot = "0.12"
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
sys-locale = "0.3"
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
